<!DOCTYPE html>
<html lang="fr">

<head>
    <title>Assistant IA de Livraison de Nourriture</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <h1>Bienvenue sur l'Agent Alimentaire IA</h1>

        <form id="chat-form" autocomplete="off">
            <input type="text" name="prompt" id="prompt" placeholder="Posez une question sur notre nourriture..."
                required>
            <button type="submit">Demander</button>
        </form>

        <div id="response"></div>

        <div id="suggestions">
            <h3>Essayez l'une de ces suggestions :</h3>
            <ul>
                {% for p in prompts %}
                <li><button class="suggestion">{{ p }}</button></li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <script>
        document.querySelectorAll('.suggestion').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('prompt').value = btn.textContent;
            });
        });

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const responseDiv = document.getElementById('response');
            responseDiv.innerHTML = 'Chargement...';
            const res = await fetch('/ask', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            responseDiv.innerHTML = `<p><strong>Réponse :</strong> ${data.answer}</p>`;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        });
    </script>
</body>

</html>
